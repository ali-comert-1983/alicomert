<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali CÖMERT – TrueMax Gayrimenkul</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020612;
      background-image: radial-gradient(circle at top right, #0a1931, transparent 50%),
                        radial-gradient(circle at bottom left, #0a1931, transparent 50%);
      font-family: 'Montserrat', sans-serif;
      padding: 20px;
      color: #fff;
    }

    .card {
      background: linear-gradient(145deg, rgba(10, 20, 35, 0.9), rgba(5, 10, 20, 0.95));
      border: 1px solid #d4af3744;
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.1) inset;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Glow effect */
    .card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(transparent, transparent, transparent, #d4af3733);
      animation: rotate 10s linear infinite;
      z-index: 0;
      pointer-events: none;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: linear-gradient(145deg, #060b14, #0b1528);
      border-radius: 22px;
      z-index: 0;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .logo-area {
      margin-bottom: 25px;
    }

    .company {
      color: #d4af37;
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
    }
    
    .company-sub {
      color: #fff;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.8;
      margin-top: 4px;
    }

    .photo-wrapper {
      margin: 20px auto 25px;
      width: 140px;
      height: 180px;
      border-radius: 100px 100px 20px 20px;
      padding: 3px;
      background: linear-gradient(135deg, #d4af37, #f3e5ab, #d4af37);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 98px 98px 18px 18px;
      background: #000;
    }

    .name {
      color: #d4af37;
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 5px;
      text-shadow: 0 2px 15px rgba(212, 175, 55, 0.4);
    }

    .title {
      color: #fff;
      font-size: 14px;
      font-style: italic;
      letter-spacing: 1px;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      margin: 20px auto;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      cursor: pointer;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .btn:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .btn:active { transform: translateY(0); }

    .btn-call {
      background: linear-gradient(135deg, #d4af37, #f3e5ab, #d4af37);
      color: #051024;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    .btn-call:hover {
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
    }

    .btn-save {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #d4af37;
    }

    .btn-save:hover { 
      background: rgba(212, 175, 55, 0.2); 
    }

    .btn-whatsapp {
      background: #128C7E;
      color: #fff;
    }
    .btn-whatsapp:hover { background: #075E54; }

    .btn-instagram {
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: #fff;
    }

    .btn-sahibinden {
      background: #ffe800;
      color: #000;
      font-weight: 700;
    }
    .btn-sahibinden:hover { background: #e6d100; }

    .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .footer {
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      letter-spacing: 0.5px;
      margin-top: 20px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 15px;
      line-height: 1.6;
    }

  </style>
</head>

<script>
  function saveContact() {
    const vcf = `BEGIN:VCARD
VERSION:3.0
N:CÖMERT;Ali;;;
FN:Ali CÖMERT
ORG:TRUEMAX Gayrimenkul
TITLE:Gayrimenkul Danışmanı
TEL;TYPE=CELL,VOICE:+905322384039
TEL;TYPE=WORK,VOICE:+905322384039
URL:http://www.truemax.com.tr
URL:https://ali-comert-1983.github.io/alicomert/
URL:https://www.instagram.com/alicomertankara?igsh=MXJ1N3Blcm4zYm9saQ%3D%3D&utm_source=qr
ADR;TYPE=WORK:;;Prof. Dr. Ahmet Taner Kışlalı Mah. 2812. Cad. No:43 ILKO SİTESİ;Çankaya;Ankara;;Türkiye
END:VCARD`;

    const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Ali_COMERT.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
</script>
